<html lang="ko">
<!-- s : 학과시험 방문시간 예약 바로가기 팝업 script -->
<head>
    <script type="text/javascript">
	    $(document).ready(function() {
	        var modalPopupDiv = document.getElementById("modalPopupDiv");
	        //닫기버튼
	        document.addEventListener('keydown',function(e){
	            if(e.keyCode == 13 && modalPopupDiv.style.display != "none") {
	                  fnPopupClose();
	            }
	        });
	    });

	    //닫기
	    function fnPopupClose(){
	        var focusId = 'goReserSubExamBtn';
	        setTimeout(function() { $("#"+focusId).focus();}, 50);
	        $("#modalPopupDiv").modal("hide");
	    }
    </script>
</head>
<!-- e : Modal 학과시험 방문시간 예약 바로가기 팝업 script -->

<!-- s : Modal 학과시험 방문시간 예약 바로가기 -->
<body>
    <div class="modal-header">
        <h5 class="modal-title">학과시험 방문시간 예약</h5>
    </div>

        <br/><br/>※ 토요특별 학과시험(총 15개 시험장) 관련 안내
        <br/>- 도봉, 대구시험장 토요특별 학과시험은 예약 필요
        <br/>- 그 외 13개시험장(강남,강서,서부,북부,남부,인천,

    </div>

    </div>
    <button type="button" class="modal-btn-close" title="팝업 닫기" onclick="javascript:fnPopupClose();">닫기</button>
</body>
