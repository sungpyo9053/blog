			if (result == "S") {
				fn_result();
			} else {
				nts_getMsgAlert(msg);	
			}
		}
		else if (actionId == "ATTSFAAA005R01") {
			if (result == "S") {
				fn_result2();
			} else {
				nts_getMsgAlert(msg);	
				ntsframework.moreview("divMore", pageInfoVO);
			}
		}
	}

	/***************************************
	* 납세자 번호 formater
	
	* @param value : 1234567890
	* @returns 123-45-67890
	
	* @param value : 1234567890123
	* @returns 123456-7890123
	****************************************/
	function fn_txprNoFormat(value){
		if(nts_isNull(value)) return "";
		value = "" + value.replace(/-/g,"");
		
		if(value.length == 10){
			value = value.substring(0, 3) + "-" + value.substring(3,5) + "-" + value.substring(5);
		}else if(value.length == 13){
			value = value.substring(0, 6) + "-" + value.substring(6);
		}
	    return value;
	}
