    <script type="text/javascript">
        util = {}
        util.getParam = function(sname){
            var params = location.search.substr(location.search.indexOf("?")+1);
            var sval="";
            params=params.split("&");
            for(var i=0; i<params.length; i++){
                temp = params[i].split("=");
                if(temp[0]==sname){sval=temp[1];}
            }
            return sval;
        }
    </script>

    <script>
        function oninitframework()
        {

                search = /([^&=]+)=?([^&]*)/g,
                decode = function (s) { return decodeURIComponent(s.replace(pl, " ")); },
                query  = window.location.search.substring(1);
                while (match = search.exec(query)) { urlParams[decode(match[1])] = decode(match[2]); }
                })();
            
            <!-- history -->
            nexacro.urlParams = urlParams;
                
            nexacro._launch_screenid = urlParams.screenid;      
            <!-- SCREEN_INFORMATION : create screen information defined in Environment > ScreenDefinition -->

            {"id":"ScreenDeskTop","type":"desktop","loadingimage":"url(\'theme://images/loading.gif\')","locale":"ko_KR","enableaccessibility":"true","accessibilitytype":"sensereader","accessibilitydescreadtype":"label,action,description","key":"NEIS","tracemode":"new","accessibilityheadingnexthotkey":"ALT+1","accessibilityheadingprevhotkey":"ALT+2","themeid":"theme::neis","initvaluefileid":"initvalue::accessbility.xiv","xadl":"edu.cloud.pa.pas.ui.xadl.js"},
            {"id":"mobile","type":"mobile_medium","zoomfactortype":"portrait","userzoom":"false","loadingimage":"url(\'theme://images/loading.gif\')","accessibilitytype":"standard","key":"NEIS","enabletouchevent":"true","accessibilityheadingprevhotkey":"ALT+2","accessibilityheadingnexthotkey":"ALT+1","accessibilitydescreadtype":"label,action,description","themeid":"theme::neis_m","initvaluefileid":"initvalue::accessbility_M.xiv","xadl":"edu.cloud.pa.pas.ui.xadl.js"},

            ];

            <!-- device별 셋팅-->
            var deviceInfo = {};
            deviceInfo = ( function() {
                //deviceInfo.screenid = "ScreenDeskTopP";
                //deviceInfo.screenType = "desktop";
                deviceInfo.isMobile = "N";
                
				var nTouchPt = navigator.maxTouchPoints;
                var userAgent = navigator.userAgent.toLowerCase();
				var isMobile = /android|iphone|ipad|mobile|nokia|blackbeerry|lgtelecom|natebrowser|sonyericsson|ipod|mobi|sm|samsung/i.test(userAgent);  // linux||macintosh|mac 조건 제거
                                
               if(isMobile)
