<style type="text/css">

<body style="FONT-FAMILY: Malgun Gothic; FONT-SIZE: 10pt"><!--StartFragment-->
<p style="LINE-HEIGHT: 140%" class="0"><span style="FONT-FAMILY: 맑은 고딕; LETTER-SPACING: 0pt">- </span><span style="FONT-FAMILY: 맑은 고딕">노동관계 법령에&nbsp;따라 관계기관에 대하여 행하는 신고</span><span style="FONT-FAMILY: 맑은 고딕; LETTER-SPACING: 0pt">, </span><span style="FONT-FAMILY: 맑은 고딕">신청</span><span style="FONT-FAMILY: 맑은 고딕; LETTER-SPACING: 0pt">, </span><span style="FONT-FAMILY: 맑은 고딕">보고</span><span style="FONT-FAMILY: 맑은 고딕; LETTER-SPACING: 0pt">, </span><span style="FONT-FAMILY: 맑은 고딕">진술</span><span style="FONT-FAMILY: 맑은 고딕; LETTER-SPACING: 0pt">, </span><span style="FONT-FAMILY: 맑은 고딕">청구</span><span style="FONT-FAMILY: 맑은 고딕; LETTER-SPACING: 0pt">(</span><span style="FONT-FAMILY: 맑은 고딕">이의신청</span><span style="FONT-FAMILY: 맑은 고딕; LETTER-SPACING: 0pt">, </span><span style="FONT-FAMILY: 맑은 고딕">심사청구 및 심판청구를 </span></p>
<p style="LINE-HEIGHT: 140%" class="0"><span style="FONT-FAMILY: 맑은 고딕">&nbsp; 포함한다</span><span style="FONT-FAMILY: 맑은 고딕; LETTER-SPACING: 0pt">) </span><span style="FONT-FAMILY: 맑은 고딕">및&nbsp;구제 등의 대행 또는 대리</span></p>
<p style="LINE-HEIGHT: 140%" class="0"><span style="FONT-FAMILY: 맑은 고딕; LETTER-SPACING: 0pt">- </span><span style="FONT-FAMILY: 맑은 고딕">노동관계 법령에 따른 모든 서류의 작성 및 확인</span></p>
<p style="LINE-HEIGHT: 140%" class="0"><span style="FONT-FAMILY: 맑은 고딕; LETTER-SPACING: 0pt">- </span><span style="FONT-FAMILY: 맑은 고딕">노동관계 법령과 노무관리에 관한 상담</span><span style="FONT-FAMILY: 맑은 고딕; LETTER-SPACING: 0pt">, </span><span style="FONT-FAMILY: 맑은 고딕">지도</span></p>
<p style="LINE-HEIGHT: 140%" class="0"><span style="FONT-FAMILY: 맑은 고딕; LETTER-SPACING: 0pt">&nbsp;「</span><span style="FONT-FAMILY: 맑은 고딕">근로기준법</span><span style="FONT-FAMILY: 맑은 고딕; LETTER-SPACING: 0pt">」</span><span style="FONT-FAMILY: 맑은 고딕">을 적용 받는 사업이나 사업장에 대한 노무관리 진단</span></p>
<p style="LINE-HEIGHT: 140%" class="0"><span style="FONT-FAMILY: 맑은 고딕; LETTER-SPACING: 0pt">- </span><span style="FONT-FAMILY: 맑은 고딕; LETTER-SPACING: 0pt">「</span><span style="FONT-FAMILY: 맑은 고딕">노동조합 및 노동관계조정법</span><span style="FONT-FAMILY: 맑은 고딕; LETTER-SPACING: 0pt">」 </span><span style="FONT-FAMILY: 맑은 고딕">제</span><span style="FONT-FAMILY: 맑은 고딕; LETTER-SPACING: 0pt">52</span><span style="FONT-FAMILY: 맑은 고딕">조에서 정한 사적 조정이나 중재</span></p>
<p style="LINE-HEIGHT: 140%" class="0"><span style="FONT-FAMILY: 맑은 고딕"></span>&nbsp;</p>
<p style="LINE-HEIGHT: 140%; TEXT-INDENT: -15pt; MARGIN-LEFT: 20px" class="0"><strong><span style="FONT-FAMILY: 맑은 고딕; LETTER-SPACING: 0pt">&nbsp;※ </span><span style="FONT-FAMILY: 맑은 고딕; LETTER-SPACING: 0.3pt">&ldquo;</span><span style="FONT-FAMILY: 맑은 고딕; LETTER-SPACING: 0.3pt">노무관리진단</span><span style="FONT-FAMILY: 맑은 고딕; LETTER-SPACING: 0.3pt">&rdquo;</span><span style="FONT-FAMILY: 맑은 고딕; LETTER-SPACING: 0.3pt">이란 사업 또는 사업장의 노사 당사자 한쪽 또는 양쪽의 의뢰를 받아 그 사업 </span><span style="FONT-FAMILY: 맑은 고딕">또는 사업장의 인사</span><span style="FONT-FAMILY: 맑은 고딕; LETTER-SPACING: 0pt">, </span><span style="FONT-FAMILY: 맑은 고딕">노무관리</span><span style="FONT-FAMILY: 맑은 고딕; LETTER-SPACING: 0pt">, </span><span style="FONT-FAMILY: 맑은 고딕">노사관계 등에 관한 사항을 분석</span><span style="FONT-FAMILY: 맑은 고딕; LETTER-SPACING: 0pt">, </span><span style="FONT-FAMILY: 맑은 고딕">진단하고</span><span style="FONT-FAMILY: 맑은 고딕; LETTER-SPACING: -0.2pt"> </span><span style="FONT-FAMILY: 맑은 고딕; LETTER-SPACING: -0.2pt">그 결과에 </span><span style="FONT-FAMILY: 맑은 고딕">대하여 합리적인 개선 방안을 제시하는 일련의 행위를 말함</span></strong></p>
<p style="LINE-HEIGHT: 140%"><strong>&nbsp;</strong></p>
</body>
