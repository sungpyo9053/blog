	/************************************
	* 화면 초기값 셋팅   
	************************************/
	function fn_setInitValue() {
		
		$('#applDt').text(nts_cvtDateFormat("yyyy-MM-dd", nts_getToday()));	// 신청일 셋팅
		
		//과세연도 selectBox 값 세팅(현재연도 - 1년부터 5년간))
		var currentYear = nts_getToday();
		var setYear;
		
		if(currentYear.substring(4,8) >= "0501"){
			setYear = Number(currentYear.substring(0,4));
		}else{
			setYear = Number(currentYear.substring(0,4))-1;
		}
		var node = [];
		// 2015-11-20 : 과세기간 최근 5개연도에서 1983년까지로 변경
		var chkYear = Number(setYear) - 1983;

		for(var i=0; i < chkYear; i++){
			node[i] = setYear-(i+1);
		}

		for(var j=0; j<node.length; j++){
			var tempValue1 = node[j]+"01";
			var tempValue2 = node[j]+"12";
			$("#cmbSbTxnrmStrtYr").append("<option value='"+tempValue1+"'>"+node[j]+"</option>");
			$("#cmbSbTxnrmEndYr").append("<option value='"+tempValue2+"'>"+node[j]+"</option>");
		}

		var dayIndex = new Date(nts_cvtDateFormat("yyyy-MM-dd", nts_getToday().substring(0,4) + "0630")).getDay();
		var psblDd = "1";
		if(dayIndex == 0){
			psblDd = "2";
		}else if(dayIndex == 6){
			psblDd = "3";
		}
		$(".total_tip .info li:eq(2)").html("전년도 종합소득세신고자용 소득금액증명은 7."+psblDd+"일부터 발급가능합니다.");

	}

	* 소득금액증명 화면 필수값 셋팅 - 
	************************************/
	function fn_chkMdtyVaildation() {
		
		var englCvaAplnYnData = $("#cmbEnglCvaAplnYn > option:selected").val();	//발급유형
		var sbTxnrmStrtYr = $("#cmbSbTxnrmStrtYr > option:selected").val();	//과세기간 시작연도  
		var sbTxnrmEndYr = $("#cmbSbTxnrmEndYr > option:selected").val();	//과세기간 종료연도
		var cvaDcumUseUsgCd = $("#cmbCvaDcumUseUsgCd > option:selected").val();	//사용용도  
		var cvaDcumSbmsOrgnClCd = $("#cmbCvaDcumSbmsOrgnClCd > option:selected").val();	//제출처  
		var incOcplOpYn = $('input[name=rdoIncOcplOpYn]:checked').val();	//소득발생처공개여부
		
		if(nts_isNull(englCvaAplnYnData)) { 
			nts_getMsgAlert("발급유형을 선택해주세요.","알림",function() {
				$("#cmbEnglCvaAplnYn").focus();
			});
			return false; 
		}
		if(nts_isNull(sbTxnrmStrtYr)) {
			nts_getMsgAlert("과세기간 시작연도를 선택해주세요.","알림",function() {
				$("#cmbSbTxnrmStrtYr").focus();
			});
			return false; 
		}
		if(nts_isNull(sbTxnrmEndYr)) {
			nts_getMsgAlert("과세기간 종료연도를 선택해주세요.","알림",function() {
				$("#cmbSbTxnrmEndYr").focus();
			});
			return false; 
		}
		if(sbTxnrmStrtYr > sbTxnrmEndYr) {
			nts_getMsgAlert("과세기간 시작연도가 과세기간 종료연도보다 클 수 없습니다.","알림",function() {
				$("#cmbSbTxnrmStrtYr").focus();
			});
			return false; 
		}
		if(nts_parseNumber( sbTxnrmEndYr.substring(0,4) ) - nts_parseNumber(sbTxnrmStrtYr.substring(0,4)) > 4){
			nts_getMsgAlert("과세기간 범위는 5년이내로 선택해주세요.","알림",function() {
				$("#cmbSbTxnrmEndYr").focus();
			});
			return false;		
		}
		if(nts_isNull(cvaDcumUseUsgCd)) {
			nts_getMsgAlert("사용용도를 선택해주세요.","알림",function() {
				$("#cmbCvaDcumUseUsgCd").focus();
			});
			return false; 
		}
		if(nts_isNull(cvaDcumSbmsOrgnClCd)) {
			nts_getMsgAlert("제출처를 선택해주세요.","알림",function() {
				$("#cmbCvaDcumSbmsOrgnClCd").focus();
			});
			return false; 
		}
           
		var v_whtxRperAllPrnYn = "N";
		
		//일용근로 원천징수의무자 전체표기 선택시
		if( document.getElementById("chkWhtxRperAllPrnYn").checked == true ) { 
			v_whtxRperAllPrnYn = "Y";
		}else{
			v_whtxRperAllPrnYn = "N";
		}
		
		
		ntsframework.object.set("map[@id='tticaam006DVO']/cvaKndCd", "B1022"); //민원종류코드
		
		ntsframework.object.set("search[@id='searchCva']/cvaKndCd", "B1022"); 			// (영문증명민원신청입력)에 파라미터 넘기기
		ntsframework.object.set("search[@id='searchCva']/whtxRperAllPrnYn", v_whtxRperAllPrnYn); 	//(영문증명민원신청입력)에 파라미터 넘기기
		ntsframework.object.set("search[@id='searchCva']/incOcplOpYn", incOcplOpYn); 	// (영문증명민원신청입력)소득발생처공개여부
		
		ntsframework.object.set("search[@id='keywords']/cvaKndCd", "B1022"); 			// 한글증명 선택시 s1 node
		ntsframework.object.set("search[@id='keywords']/whtxRperAllPrnYn", v_whtxRperAllPrnYn); 	//원천징수의무자 전체표시
		ntsframework.object.set("search[@id='keywords']/incOcplOpYn", incOcplOpYn); //소득발생처공개여부
		ntsframework.object.set("search[@id='keywords']/englAplcYn", englCvaAplnYnData); //발급유형
		ntsframework.object.set("search[@id='keywords']/txnrmStrtYm", sbTxnrmStrtYr); //과세기간 시작년월
		ntsframework.object.set("search[@id='keywords']/txnrmEndYm", sbTxnrmEndYr); //과세기간 종료년월
		ntsframework.object.set("search[@id='keywords']/cvaDcumUseUsgCd", $('#cmbCvaDcumUseUsgCd').val()); //사용용도
		ntsframework.object.set("search[@id='keywords']/cvaDcumSbmsOrgnClCd", $('#cmbCvaDcumSbmsOrgnClCd').val()); //제출처
		ntsframework.object.set("search[@id='keywords']/tin", tin); // 납세자TIN				
		ntsframework.object.set("map[@id='tticaam006DVO']/txnrmStrtYm",sbTxnrmStrtYr); //과세기간 시작년월
		ntsframework.object.set("map[@id='tticaam006DVO']/txnrmEndYm",sbTxnrmEndYr); //과세기간 종료년월
		ntsframework.object.set("map[@id='tticaam006DVO']/cvaTrtStatCd", "04"); //민원처리상태 - 처리완료				
		ntsframework.object.set("map[@id='tticaad023DVO']/cvaDcumUseUsgCd", $('#cmbCvaDcumUseUsgCd').val()); //사용용도
		ntsframework.object.set("map[@id='tticaad023DVO']/cvaDcumSbmsOrgnClCd", $('#cmbCvaDcumSbmsOrgnClCd').val()); //제출처
