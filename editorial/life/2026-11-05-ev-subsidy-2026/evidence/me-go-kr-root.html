<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<title>기후에너지환경부</title>
		<meta property="og:site_name" content="기후에너지환경부">
		<link rel="canonical" href="https://mcee.go.kr/home/web/main.do" />
		<script type="application/ld+json">
			{
				"@context":"https://schema.org",
				"@type":"WebSite",
				"name":"기후에너지환경부",
				"alternateName":["기후부", "MCEE"],
				"url":"https://mcee.go.kr/"
			}
		</script>	
	</head>
	<script>
		function isSmartPhone() {
			return /Mobi|Android|iPhone|iPad|iPod|Winddows Phone|webOS/i.test(navigator.userAgent);
		}
		
		const {hostname} = window.location;
		let uri = hostname;
		let mainUri = '/home/web/main.do';

		if(uri!=null) {
			if (uri.startsWith('eng.mcee.go.kr')) {
				mainUri = '/eng/web/main.do';			
			} else if (uri.startsWith('eng.me.go.kr')) {
				mainUri = 'https://mcee.go.kr/eng/web/main.do';
			} else if (uri.startsWith('niwdc.mcee.go.kr')) {
				mainUri = '/niwdc/web/main.do';			
			} else if (uri.startsWith('niwdc.me.go.kr')) {
				mainUri = 'https://mcee.go.kr/niwdc/web/main.do';
			} else if (uri.startsWith('m.mcee.go.kr')) {
				mainUri = '/m/mob/main.do';
			} else if (uri.startsWith('m.me.go.kr')) {
				mainUri = 'https://mcee.go.kr/m/mob/main.do';
			} else if (uri.startsWith('www.me.go.kr')) {
				mainUri = uri.replace('me.', 'mcee.');
				if (mainUri.indexOf('http') < 0){
					mainUri = 'https://' + mainUri;
				}
			} else if (uri.startsWith('me.go.kr')) {
				mainUri = uri.replace('me.', 'mcee.');
				if (mainUri.indexOf('http') < 0){
					mainUri = 'https://' + mainUri;
				}
			} else {
				if (isSmartPhone()) {
					mainUri = '/m/mob/main.do';
				}else{
					mainUri = '/home/web/main.do';
				}
			}
		}

		location.href = mainUri;
	</script>
	<body>
	</body>
</html>
