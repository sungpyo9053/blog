window.onload = function(){

		var allowPageList = new Array('/a.php', '/b.php');

		for (number in allowPageList) { 
			var regExp = new RegExp('^' + allowPageList[number] + '.*', 'i');

		 		} 
		 	return false; 
		 } else if (e.which == 82 && e.ctrlKey) {

		 	return false; } 
		 } 
	});
};
