<script type="text/javaScript">
/* 
	//접속제한 체크
	
		netFunnel_check();
	
 */
	<!-- 모바일 출력버튼 삭제 -->
	document.onreadystatechange = function () {
		if (document.readyState === 'interactive') {
			if("false" == "true") {
				$("#wrap").addClass('device-mo');
				$('button').filter(function() {return $(this).text() === '출력';}).addClass('mo-hidden');
			}
		}
	}
	
	var isDownloading = false;
	
	/* 첨부파일 비동기 요청 */
	function fnDownAtchfileAsync(target, atchfileId, atchfileNm) {
	    var frm = document.atchfileForm;
	    frm.atchfileId.value = atchfileId;
	    frm.atchfileNm.value = atchfileNm;
	    
	    if (isDownloading) {
			return;
	    }else if(!isDownloading){
	        toggleClick(target);
			startLoading();
	    }
	    
		isDownloading = true;
		//파일 다운로드시 중복 요청 방지
        var form = $("form[name=atchfileForm]").serialize();
		
        var xhr = new XMLHttpRequest();
        xhr.open('POST', '/cs/CsDownAtchfile.do', true);
        xhr.responseType = 'blob';
        xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
        
        xhr.onload = function() {
            if (this.status === 200) {	
                var blob = new Blob([this.response], { type: 'application/octet-stream' });
                
                var disposition = xhr.getResponseHeader('Content-Disposition');
                if (disposition && disposition.indexOf('attachment') !== -1) {
	             	var filename = atchfileNm;
                }else {
                	alert(msgBox('','조회하는데 실패하였습니다.'));
                }
                
             	// IE 대응 (msSaveBlob 사용)
                if (window.navigator && window.navigator.msSaveBlob) {
                    window.navigator.msSaveBlob(blob, filename);
                }else {
	                // 파일 다운로드
	                var url = window.URL.createObjectURL(blob);
	                var a = document.createElement('a');
	                a.href = url;
	                a.download = filename;
	                
	             	// Safari에서 .txt가 붙는 것을 방지하기 위해 body에 잠시 추가
	                document.body.appendChild(a);
	                a.click();
	                window.URL.revokeObjectURL(url);
	                a.remove();
                }
             	
                endLoading();
            	isDownloading = false;
       	        toggleClick(target);
             	
            } else {
            	alert(msgBox('','조회하는데 실패하였습니다.'));
            }
        };
        xhr.send(form);
	}
	
	function startLoading(){
		$("#loading").show().fadeIn("fast");
	}
	
	function endLoading(){
		$("#loading").hide();
	}
	
	function toggleClick(target) {
		const $target = $(target);
	    const isDisabled = $target.css('pointer-events') === 'none';

	    $target.css({
	        'pointer-events': isDisabled ? 'auto' : 'none',
	        'cursor':         isDisabled ? 'pointer' : 'default',
	        'opacity':        isDisabled ? '1' : '0.5' // 처리 중임을 알리는 시각적 효과
	    });
	}
	
	function fileDownloader(fileUrl) {
	    
	    var downloadLink = document.createElement('a');
	    downloadLink.href = fileUrl;
	    
	    document.body.appendChild(downloadLink);
	    downloadLink.click();
	    document.body.removeChild(downloadLink);
	}
	
	
</script>

	function initValue() {
		$("#contentSpan").html("<div class=\"txtBox guide mb10\"><strong>전자가족관계등록시스템에서 다음의 서비스를 이용하시는 경우 인증서가 필요합니다.</strong><br><ul class=\"buList t16\"><li>등록사항별증명서, 제적등&middot초본 열람/발급<br /></li><li>나의 발급 이력 조회</li><li>인터넷 신고 제출/수정/처리 내역 확인</li><li>아포스티유 신청을 위한 증명서 발급정보 전송</li></ul></div><br /><h3 class=\"sTitle\">사용 가능한 인증서</h3><div class=\"txtBox guide mb10\">인증서는 전자정부법 제29조 제5항의 위임에 따른 행정전자서명 또는 전자서명법 제2조 제6호의 인증서로서 서명자의 실지명의를 확인할 수 있는 것이어야 합니다.<br><br>전자가족관계등록시스템에서 사용 가능한 인증서에는 *공동인증서(NPKI, GPKI, EPKI 등), 금융인증서, 간편인증이 있으며, 간편인증은 증명서발급시에만 사용 가능 합니다. 점차 다양한 인증서를 사용할 수 있도록 서비스를 확대해 나갈 예정입니다.<br><p class=\"alInfo tBlue\"> <strong>공동인증서는 2020.12.10. 전자서명법 개정으로 공인인증서의 지위가 상실되고 공동인증서로 명칭만 변경된 것으로 <u>기존과 동일하게 사용</u>할 수 있습니다.</strong></p></div><br /><h3 class=\"sTitle\">인증서 발급 방법</h3><div class=\"txtBox guide mb10\"><p class=\"tOrange\"><strong>전자가족관계등록시스템에서는 인증서 발급/재발급 서비스를 제공하고 있지 않습니다.</strong></p>인증서는 가까운 금융기관(은행, 우체국, 증권사 등)이나 등록대행기관에서 발급/재발급 받으시고, 관련 문의는 해당 발급기관으로 하시기 바랍니다.<br><br>재외국민의 경우 영사서비스를 제공하는 모든 재외공관에서 공동인증서 발급신청이 가능합니다.</div>");
	}
	
</script>
