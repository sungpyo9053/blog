function doResize(){
	var brVer = navigator.userAgent;//브라우져 정보
	var brVerId = brVer.indexOf('MSIE');//브라우져 정보에서 'MSIE'라는 부분의 문자열
	var brNum = brVer.substr(brVerId,8);//브라우져 버전('MSIE' 포함..)..
	var brNum2 = brNum.substr(5,3)//브라우져 버번. 숫자만...
	var ifrm = document.body;
	var x = ifrm.scrollWidth;
	var y = ifrm.scrollHeight;
	if(Number(brNum2) >= 7) {
		window.resizeTo(x+10,y+90);
	} else {
		window.resizeTo(x+10,y+90);
	}
}

var winResizeW = 0;
var winResizeH = 0;

(function($) {
    $(function () {
        $(document).ready(function () {
               var filter = "win16|win32|win64|mac";
               if( navigator.platform  ){
                   if( filter.indexOf(navigator.platform.toLowerCase())<0 ){
       	      self.close();
                   }
                }
        	$('#popup').css('height', $('#popup').css('width'));
        });//ready
 
        $(window).load(function () {
        	  //크롬, 사파리일때
            if (navigator.userAgent.indexOf('Chrome')>-1 || navigator.userAgent.indexOf('Safari')>-1) 
            {
                $(window).resize(function() {
                    
                    if(winResizeW==0 && winResizeH==0)
                    {
                    	popupAutoResize();//팝업리사이징
                    }
                });
            }
            //크롬, 사파리말고 모두
            else
            {
            	popupAutoResize();//팝업리사이징
            }
            
        });//load
    });//$
 
    function popupAutoResize() {//팝업리사이징
       
        var mw = window.outerWidth - window.innerWidth;
        var mh = window.outerHeight - window.innerHeight;
      
         if (navigator.userAgent.indexOf('Chrome')>-1 || navigator.userAgent.indexOf('Safari')>-1)  {
             var conW = $('#popup').innerWidth(); 
             var conH =  $('#popup').innerHeight();
             
             winResizeW = conW + mw;
             winResizeH = conH + mh;
             
             window.resizeTo(winResizeW,winResizeH);        	 
         } else {
        	        	 
        	 var w = document.getElementsByTagName('div')[1].clientWidth;
             var h = document.getElementsByTagName('div')[1].clientHeight;
             window.resizeTo(w, h);
             
             window.resizeBy(mw, mh);
             
             if (msieversion() < 9 && msieversion() != 0) {
                 // get window fake outer size
                 var fakeOuterWidth = document.documentElement.clientWidth;
                 var fakeOuterHeight = document.documentElement.clientHeight;
      
                 // resize to innerSize
                 window.resizeTo(fakeOuterWidth, fakeOuterHeight);
      
                 // get window fake inner size
                 var fakeInnerWidth = document.documentElement.clientWidth;
                 var fakeInnerHeight = document.documentElement.clientHeight;
      
                 // get delta
                 deltaWidth = fakeOuterWidth - fakeInnerWidth;
                 deltaHeight = fakeOuterHeight - fakeInnerHeight;
                 window.resizeTo(w + deltaWidth, h + deltaHeight);
             }
         }
 
    }
    function msieversion() {//익스버전체크
        var ua = window.navigator.userAgent;
        var msie = ua.indexOf ( "MSIE " );
        if ( msie > 0 ) // If Internet Explorer, return version number
            return parseInt (ua.substring (msie+5, ua.indexOf (".", msie )));
        else // If another browser, return 0
            return 0;
    }
})(jQuery);

		var conH = $(".popup").innerHeight();//컨텐츠사이즈

		var winOuterW = window.outerWidth; //브라이져사이즈
		var winOuterH = window.outerHeight; //브라이져사이즈

		var winInnerW = window.innerWidth;//스크롤 포함한 body영역
		var winInnerH = window.innerHeight;//스크롤 포함한 body영역

		var winOffSetW = window.document.body.offsetWidth;//스크롤 제외한 body영역
		var winOffSetH = window.document.body.offsetHeigth;//스크롤 제외한 body영역

		var borderW = winOuterW - winInnerW;
		var borderH = winOuterH - winInnerH;

		winResizeW = conW + borderW;
		winResizeH = conH + borderH;
		window.resizeTo(winResizeW, winResizeH);
	}
