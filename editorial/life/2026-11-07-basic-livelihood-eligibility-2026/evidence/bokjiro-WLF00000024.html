csvPage.do\",\"onapUrl\":\"/twoaa/aplySrvChc/selectCvlcptServChs.do?menuGb\\u003dtwoaa\\u0026srvGb\\u003d324\",\"dpsrvChckYn\":\"N\",\"bizChrDeptNm\":\"아이돌봄지원과\",\"simbPsbltYn\":\"N\",\"srvId\":null,\"blchTrgtBizDcd\":null,\"crtrYr\":\"2026\",\"wlfareSprtTrgtCn\":\"\\u003cdiv class\\u003d\\\"bokjiServiceView\\\"\\u003e\\n\\u003cdiv class\\u003d\\\"bokjiConts\\\"\\u003e\\n\\u003cul class\\u003d\\\"bokjiContsIn\\\"\\u003e\\n\\u003cul class\\u003d\\\"bokjiBlit01\\\"\\u003e\\n\\u003cli\\u003e정부 지원 대상자 자격기준은\\u0026nbsp;다음과 같습니다.\\u003c/li\\u003e\\n\\u003cul class\\u003d\\\"txtBlit4\\\"\\u003e\\n\\u003cli\\u003e아동의 연령이 12세 이하\\u003c/li\\u003e\\n\\u003cli\\u003e부모의 취업 등으로 양육공백 발생\\u003c/li\\u003e\\n\\u003cli\\u003e자녀양육 정부지원 중복 금지 기준\\u003c/li\\u003e\\n\\u003cli\\u003e가구 기준중위소득 250% 이하인 가정\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cli class\\u003d\\\"even\\\"\\u003e상기 \\u0026#9312;, \\u0026#9313;, \\u0026#9314; 의 조건 충족 시 정부지원이 가능하며, \\u0026#9315;의 가구 소득에 따라 서비스 유형별 정부지원의 범위가 달라집니다.\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003c/ul\\u003e\\u003c/div\\u003e\\u003c/div\\u003e\",\"aplyMtdDc\":\"\\u003cdiv class\\u003d\\\"bokjiServiceView\\\"\\u003e\\n\\u003cdiv class\\u003d\\\"bokjiConts\\\"\\u003e\\n\\u003cul class\\u003d\\\"bokjiContsIn\\\"\\u003e\\n\\u003cul class\\u003d\\\"bokjiBlit01\\\"\\u003e\\n\\u003cli\\u003e신청권자는 다음과 같습니다. \\n\\u003cul class\\u003d\\\"txtBlit4\\\"\\u003e\\n\\u003cli\\u003e아동의 주민등록상 주소지에서 함께 거주하는 아동의 부모 또는 실양육자(가정위탁부모 포함)\\u003c/li\\u003e\\n\\u003cli\\u003e대리 신청의 경우는 대리인 신분증, 신청자의 등본, 취업증빙자료 등 지참\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\u003c/li\\u003e\\n\\u003cli\\u003e신청서식 및 구비서류는 다음과 같습니다. \\n\\u003cul class\\u003d\\\"txtBlit4\\\"\\u003e\\n\\u003cli\\u003e사회보장급여 서비스 신청서: 서비스 이용자 서약서, 응급처치동의서(아이돌봄 홈페이지 가입 시 온라인제출)\\u003c/li\\u003e\\n\\u003cli\\u003e정부지원 자격 여부 증빙자료: 맞벌이가정, 한부모 가정, 장애부모가정, 청소년부모가정, 다자녀가정, 다문화가정, 기타양육부담 가정임을 증빙하는 서류와 소득판정에 영향을 미칠수 있는 서류(육아휴직 서류 등)\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\u003c/li\\u003e\\n\\u003cli\\u003e신청 접수 시 유의사항을 안내드립니다. \\n\\u003cul class\\u003d\\\"txtBlit4\\\"\\u003e\\n\\u003cli\\u003e서비스 제공기관 홈페이지 가입 후 서비스 신청 및 본인부담금을\\u003cspan style\\u003d\\\"font-weight: bold;\\\"\\u003e 국민행복카드를 이용\\u003c/span\\u003e하여 납부\\u003cbr\\u003e ＊ 정부지원대상에 해당하지 않는 가정은 읍,면,동 주민센터를 거치지 않고 아이돌봄 홈페이지를 통해 서비스 제공기관에 바로 이용 신청\\u003c/li\\u003e\\n\\u003cli\\u003e기준 중위소득 250% 초과 가구에 대해서는 아이돌봄 홈페이지에서 바로 서비스 신청 가능\\u003c/li\\u003e\\n\\u003cli\\u003e영아종일제 신청 후 정부지원 결정되면 양육수당/부모급여 자동 종료\\u003c/li\\u003e\\n\\u003cli\\u003e아이돌봄서비스 제공이 가능한 장애아동의 범위는 장애의 정도가 심하지 않은 장애인(장애 소견 의사진단, 특수교육대상자 진단아동 포함)에 해당\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\u003c/li\\u003e\\n\\u003cli\\u003e복지로(\\u003ca href\\u003d\\\"http://www.bokjiro.go.kr\\\" tabindex\\u003d\\\"0\\\" target\\u003d\\\"_blank\\\" title\\u003d\\\"새창으로 열림\\\"\\u003ewww.bokjiro.go.kr\\u003c/a\\u003e) 서비스신청을 통한 온라인신청이 가능합니다.\\u003c/li\\u003e\\n\\u003cul class\\u003d\\\"txtBlit4\\\"\\u003e\\n\\u003cli\\u003e복지로 온라인신청 경로 : 복지로 로그인 \\u0026gt; 서비스 신청 \\u0026gt; 복지서비스 신청 \\u0026gt; 복지급여 신청 \\u0026gt; 영유아 \\u0026gt; 아이돌봄서비스\\u003c/li\\u003e\\n\\u003cli\\u003e온라인 신청 시, 관할 주민센터에\\u0026nbsp;누락된 서류가 없는지 전화로 반드시 확인이 필요합니다.\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cli\\u003e아이돌봄 대표전화(1577-8136) 또는 아이돌봄 홈페이지(\\u003ca href\\u003d\\\"https://idolbom.go.kr\\\" tabindex\\u003d\\\"0\\\" target\\u003d\\\"_blank\\\" title\\u003d\\\"새창으로 열림\\\"\\u003ehttps://idolbom.go.kr\\u003c/a\\u003e)를 참조해주시기 바랍니다.\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003c/ul\\u003e\\u003c/div\\u003e\\u003c/div\\u003e\",\"wlfareSprtTrgtSlcrCn\":\"\\u003cdiv class\\u003d\\\"bokjiServiceView\\\"\\u003e\\n\\u003cdiv class\\u003d\\\"bokjiConts\\\"\\u003e\\n\\u003cul class\\u003d\\\"bokjiContsIn\\\"\\u003e\\n\\u003cul class\\u003d\\\"bokjiBlit01\\\"\\u003e\\n\\u003cli\\u003e대상아동의 연령 기준은 아래와 같습니다. \\n\\u003cul class\\u003d\\\"txtBlit4\\\"\\u003e\\n\\u003cli\\u003e시간제 서비스 : 생후 3개월~12세 이하의 아동\\u003c/li\\u003e\\n\\u003cli\\u003e영아종일제 서비스 : 생후 3개월~36개월 이하의 영아\\u003cbr\\u003e\\n \u203b 이른둥이(미숙아\\u003cspan style\\u003d\\\"vertical-align: super;\\\"\\u003e*\\u003c/span\\u003e)의 경우, 40개월까지 이용 가능\\u003cbr\\u003e\\u0026nbsp;\\u0026nbsp; * 임신기간 37주 미만이거나 출생당시 2.5kg 미만\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\u003c/li\\u003e\\n\\u003cli\\u003e정부지원이 가능한\\u0026nbsp;양육공백 가정 기준 및 우선순위는 아래와 같습니다.\\u003cbr\\u003e * 단, 부모 모두 비취업 등으로 양육공백이 없어\\u0026nbsp;가정에서 아동을 양육하는 경우는 아이돌봄서비스 지원대상에서 제외\\u003c/li\\u003e\\n\\u003cul class\\u003d\\\"txtBlit4\\\"\\u003e\\n\\u003cli\\u003e\\u0026#9312; 맞벌이 가정, 취업 한부모가정(조손가족 포함)\\u003c/li\\u003e\\n\\u003cli\\u003e\\u0026#9313; 장애부모 가정(가정에서 아동을 양육하는 부 또는 모가 \\u0027장애인복지법 제2조\\u0027의 규정에 의한 장애인인 경우)\\u003c/li\\u003e\\n\\u003cli\\u003e\\u0026#9314; 다자녀가정\\u003cbr\\u003e -\\u0026nbsp;12세 이하 아동이 2명 이상\\u003c/li\\u003e\\n\\u003cli\\u003e\\u0026#9315; 다문화 가정\\u003cbr\\u003e - 다문화가족지원법 제2조 제1호에 해당하는 다문화가정으로서 12세 이하 아동 2명 이상인 가정\\u003c/li\\u003e\\n\\u003cli\\u003e\\u0026#9316; 기타 양육부담 가정\\u003cbr\\u003e\\n - 아버지 또는 어머니가 입증 가능한 장기입원 등의 질병을 앓고 있는 경우\\u003cbr\\u003e\\n - 아버지 또는 어머니가 학교에 재학 중이거나 취업준비 중(입증 가능해야 함)인 경우\\u003cbr\\u003e\\n - 어머니의 출산으로 출생 아동의 형제ㆍ자매를 돌볼 수 없을 경우\\u003cbr\\u003e - 아동학대 피해 위기 아동 가정(아동학대 전담공무원 또는 아동보호전분기관의 사례관리 중 양육공백을 인정받은 경우)\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cli\\u003e가구 소득기준은 기준 중위소득 250%이하인 가정으로 가구원수별\\u0026nbsp;소득기준 금액은\\u0026nbsp;아래와 같습니다.\\u003c/li\\u003e\\n\\u003cul class\\u003d\\\"txtBlit4\\\"\\u003e\\n\\u003cli\\u003e2026년 가구원수별 소득기준 금액은 다음과 같습니다. (4인 가족 월소득 기준)\\u003cbr\\u003e\\n- 기준 중위소득 75% : 4,872,000원\\u003cbr\\u003e\\n- 기준 중위소득 120% : 7,794,000원\\u003cbr\\u003e\\n- 기준 중위소득 150% : 9,743,000원\\u003cbr\\u003e- 기준 중위소득 250% : 16,237,000원\\u003c/li\\u003e\\n\\u003cli\\u003e가구 소득은 건강보험료 본인부담금 고지액을 기준으로 산정하며 건강보험 미가입 사업장에 취업한 사람의 소득은 별도로 파악합니다.\\u003c/li\\u003e\\n\\u003cli\\u003e가구원의 범위는 세대별 주민등록표에 기재된 자로서 생계와 주거를 같이 하는 아동의 2촌 이내의 가족, 직계존비속 및 배우자를 말합니다.\\u003c/li\\u003e\\n\\u003cli\\u003e소득합산 대상자의 범위는 가구원의 범위와 동일합니다.\\u003c/li\\u003e\\n\\u003cli\\u003e아버지 또는 어머니가 아동과 주민등록상 거주지가 다르고 생계와 주거를 같이 하지 않는 경우에도 소득은 합산하며 가구원 수에 포함합니다.\\u003c/li\\u003e\\n\\u003cli\\u003e부부가 이혼한 경우에는 아동의 기본증명서 상의 친권자이거나 실거주를 함께하는 아버지 또는 어머니의 소득만 산정하고 가구원 수에 포함합니다.\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003c/ul\\u003e\\n\\u003c/ul\\u003e\\u003c/div\\u003e\\u003c/div\\u003e\",\"wlfareSprtBnftCn\":\"\\u003cdiv class\\u003d\\\"bokjiServiceView\\\"\\u003e\\n\\u003cdiv class\\u003d\\\"bokjiConts\\\"\\u003e\\n\\u003cul class\\u003d\\\"bokjiContsIn\\\"\\u003e\\n\\u003cul class\\u003d\\\"bokjiBlit01\\\"\\u003e\\n\\u003cli\\u003e취업 부모 등의\\u0026nbsp;12세 이하 자녀에 대해, 아이돌보미가 대상자의 집으로 찾아가 돌봄서비스를 제공합니다. \\n\\u003cul class\\u003d\\\"txtBlit4\\\"\\u003e\\n\\u003cli\\u003e시간제 아이돌봄: 부모가 올 때까지 임시보육, 놀이 활동, 보육시설 및 초등학교 등하원(교) 동행, 준비된 식사와 간식 챙겨주기 등의 서비스 제공\\u003cbr\\u003e ＊ 영아를 대상으로 시간제 돌봄 시, 영아 종일제 아이돌봄 업무 병행\\u003c/li\\u003e\\n\\u003cli\\u003e영아 종일제 아이돌봄: 이유식 먹이기, 젖병 소독, 기저귀 갈기, 목욕 등의 서비스 지원\\u003cbr\\u003e\\n\\u003cbr\\u003e\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\u003c/li\\u003e\\n\\u003cli\\u003e2026년 아이돌봄 서비스의 1시간 당 정부지원금은 아래와 같습니다.\\u003cbr\\u003e\\n ＊ A형: \\u002719.1.1. 이후 출생 아동 /B형: \\u002718.12.31. 이전 출생 아동 \\u003cbr\\u003e\\n ＊ 지원금은 소득수준에 따라 차등 지원 \\n\\u003cul class\\u003d\\\"txtBlit4\\\"\\u003e\\n\\u003cli\\u003e일반가정 시간제 아이돌봄\\u003cbr\\u003e\\n \\u0026#9312; 가형(기준 중위소득 75%): 시간당 A형 10,872원, B형 10,232원 지원\\u003cbr\\u003e\\n \\u0026#9313; 나형(기준 중위소득 120%): 시간당 A형 7,674원, B형 6,396원 지원\\u003cbr\\u003e\\n \\u0026#9314; 다형(기준 중위소득 150%): 시간당 A형 3,838원, B형 3,198원 지원\\u003cbr\\u003e \\u0026#9315; 라형(기준 중위소득 250%): 시간당 A형 1,920원, B형 1,280원 지원\\u003c/li\\u003e\\n\\u003cli\\u003e한부모, 장애부모, 장애아동, 청소년부모 시간제 아이돌봄\\u003cbr\\u003e\\n \\u0026#9312; 가형(기준 중위소득 75%): 시간당 A형 11,512원, B형 10,872원 지원\\u003cbr\\u003e\\n \\u0026#9313; 나형(기준 중위소득 120%): 시간당 A형 7,674원, B형 6,396원 지원\\u003cbr\\u003e\\n \\u0026#9314; 다형(기준 중위소득 150%): 시간당 A형 3,838원, B형 3,198원 지원\\u003cbr\\u003e \\u0026#9315; 라형(기준 중위소득 250%): 시간당 A형 1,920원, B형 1,280원 지원\\u003c/li\\u003e\\n\\u003cli\\u003e청소년(한)부모, 0~1세 자녀 양육 가정 시간제 아이돌봄\\u003cbr\\u003e \\u0026#9312; 가형~라형(기준 중위소득 250%이하): 시간당 11,512원
