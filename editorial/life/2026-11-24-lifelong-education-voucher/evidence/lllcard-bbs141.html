







<script type="text/javascript">

$(document).ready( function(){

	fn_comm_enterSearch($("#btnSearch"));//엔터키조회
	//페이지사이즈 기본값 10, 상세에서 돌아온 경우 기존 값 유지
	if ($.trim($("#pageSize").val()) == '') {
		$("#pageSize").val("10");
	}
	
	//사용자조회 이벤트
	$("#btnSearch").click(function(){
		$("#pageIndex").val("1");
		fn_egov_select_noticeList();
	});
	
	//상세페이지에서 돌아온 경우 ajax Paging 호출
	if( !($('#pageIndex').val() == null || $.trim($('#pageIndex').val()) == '') ) {
		fn_egov_select_noticeList();
	}
	
	$("#searchCnd").on('change', fn_searchCndSelect);
	fn_searchCndSelect();
});

function fn_egov_select_noticeList(){
	var url = prefixPath + "/cop/bbs/selectBoardListAjax.do";
	
	if( !($('#pageIndex').val() == null || $.trim($('#pageIndex').val()) == '') ) {
		url = url + "?d-49520-p="+$("#pageIndex").val();
	}
	trionsoft.ajaxCall(url,
			$('#frm'),
			$('#divMain'),
			"html",
			true,
			null,
			null,
			null);
}

function fn_egov_inqire_notice_local(nttId,bbsId,localNm) {
	document.frm.nttId.value = nttId;
	document.frm.bbsId.value = bbsId;
	document.frm.localNm.value = localNm;
	document.frm.action = ""+prefixPath+"/cop/bbs/selectBoardArticle.do";
	document.frm.submit();
}

function fn_egov_inqire_notice(nttId,bbsId) {
	document.frm.nttId.value = nttId;
	document.frm.bbsId.value = bbsId;
	document.frm.action = ""+prefixPath+"/cop/bbs/selectBoardArticle.do";
	document.frm.submit();
}

function fn_changePageSize() {
    $("#pageIndex").val("1");

    let $select = $('#selectPageSize');
    let val = $select.val();

    if (!val) {
        val = $("#pageSize").val();
    }

    $("#pageSize").val(val);

    fn_egov_select_noticeList();
	
	setTimeout(function() {
		var $el = $("#selectPageSize");
		if($el.length > 0){
			$el.focus();
		}
	}, 1000);
}

function fn_searchCndSelect(){
	var searchCndVal = $("#searchCnd option:selected").val();
	if(searchCndVal == '3'){
		$('#searchWrd').val('');
		$('#searchWrd').css('display','none');
		$('#localCd').css('display','inline');
	}else{
		$('#localCd').val('');
		$('#localCd').css('display','none');
		$('#searchWrd').css('display','inline');
	}
}
</script>
