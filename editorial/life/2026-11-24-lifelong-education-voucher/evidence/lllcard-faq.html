







<script type="text/javascript">
/*********************************************************
 * 초기화
 ******************************************************** */
function fn_egov_initl_faqlist(){
	// 첫 입력란에 포커스..
	document.FaqListForm.searchKeyword.focus();
}

/* ********************************************************
 * 상세화면 이동 (현재는 사용 안 함: 리스트에서 바로 답변 노출)
 ******************************************************** */
function fn_egov_inquire_faqlistdetail(faqId) {		
	document.FaqListForm.faqId.value = faqId;
	document.FaqListForm.action = ""+prefixPath+"/faq/FaqInqireCoUpdt.do";
	document.FaqListForm.submit();	
}

$(document).ready(function(){

	if($('.tab-list li a').length>0){
		$('.tab-list li a').removeClass('show');
		$('.tab-list li a')[0].classList.add('show');
	}
	
	fn_comm_enterSearch($("#btnSearch"));//엔터키조회
	$("#pageSize").val("10");//페이지사이즈 기본값 10

	// 조회 버튼
	$("#btnSearch").click(function(){
		$("#pageIndex").val("1");
		fn_egov_search_faq();
	});
	
	// 상세에서 돌아온 경우 ajax Paging 호출
	if( !($('#pageIndex').val() == null || $.trim($('#pageIndex').val()) == '') ) {
		fn_egov_search_faq();
	}

	// 첫번째 조건 변경 시
	$("#searchCondition").change(function(){
		fn_changeSearchCnd();
	});

	// 두번째 조건 변경시 자동 검색
	$("#searchCondition2").change(function() {
		if (this.value) fn_egov_search_faq();
	});

	fn_changeSearchCnd();
});

/* FAQ 조회 (AJAX) */
function fn_egov_search_faq(){

	var url = prefixPath + "/faq/selectFaqListInqireAjax.do";
	
	if( !($('#pageIndex').val() == null || $.trim($('#pageIndex').val()) == '') ) {
		url = url + "?d-49520-p="+$("#pageIndex").val();
	}
	trionsoft.ajaxCall(
		url,
		$('#FaqListForm'),
		$('#divMain'),
		"html",
		true,
		null,
		null,
		null
	);
}

/* 페이지 사이즈 변경 */
/* function fn_changePageSize() {
	$("#pageIndex").val("1");
	$("#pageSize").val($('#selectPageSize option:selected').val());
	fn_egov_search_faq();
} */
function fn_changePageSize() {
    $("#pageIndex").val("1");

    let $select = $('#selectPageSize');
    let val = $select.val();

    if (!val) {
        val = $("#pageSize").val();
    }

    $("#pageSize").val(val);

    fn_egov_search_faq();
	
	setTimeout(function() {
		var $el = $("#selectPageSize");
		if($el.length > 0){
			$el.focus();
		}
	}, 1000);
}

/* 검색 조건 (대상 선택 시 2차 조건 노출) */
function fn_changeSearchCnd()
{
	if("faqGbn" == $("#searchCondition").val())
	{
		$("#searchCondition2").css("display", "");
		$("#searchKeyword").css("display", "none");
		$("#searchKeyword").val("");
		
	}
	else
	{
		$("#searchKeyword").css("display", "");
		$("#searchCondition2").css("display", "none");
		$("#searchCondition2").val("");
	}
}

/* 온라인 상담 탭 이동 */
function fn_moveToRegUpdateReqListPage(){
	if(prefixPath.includes("/reg")){
		fn_subPageMove('45400000', '/qna/selectBoardList.do?bbsId=BBSMSTR_000000000021', '게시판');
	}else{
		fn_subPageMove('33400000', '/org/selectBoardList.do?bbsId=BBSMSTR_000000000051', '게시판');
	}
}
</script>

	<input type="hidden" name="pageIndex"    id="pageIndex"  value="1" />

	<!-- 퍼블리싱 구조 적용 -->

							</div>
						</div>
					</div>
					<!-- 페이지 사이즈 / 페이징은 Ajax 결과(EgovFaqListInqirePagging.jsp)에서 그려지도록 유지 -->
				</div>
			</div>

		</div>
	</div>
</form>
