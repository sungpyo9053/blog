		.container li:hover b { color:#257ed7; }
		.container li:first-child { background-image: url(images/intro2_deco01.png); }
		.container li:nth-of-type(2) { background-image: url(images/intro2_deco02.png); }
		.container li:last-of-type { background-image: url(images/intro2_deco03.png); }
		.container .bottom { background:#fff url(images/intro2_logo02.png) center no-repeat; position:absolute; bottom:0; left:0; height: 50px; width: 100%; background-size: 150px; }
		.container .bottom span { font-size:0; }

		/* 팝업 전체 */
		#imgPopup { display: none;position: fixed;inset: 0;background: rgba(0, 0, 0, 0.6);z-index: 9999;overflow: auto;}
		.pop-inner { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);	width: min(90vw, 630px); max-height: 90dvh;	background: #fff; padding: 15px;border-radius: 10px;box-sizing: border-box;	overflow-x: hidden;	overflow-y: auto; }
		.popup-slide {position: relative;width: 100%;max-width: 100%;height: auto;	max-height: calc(90dvh - 120px);display: flex;	align-items: center;justify-content: center;overflow: hidden;box-sizing: border-box;}
		.popup-slide img {position: absolute;top: 0;left: 0; display: block;width: auto;height: auto;max-width: 100%;max-height: calc(90dvh - 120px);object-fit: contain;opacity: 0;	transition: opacity 0.5s ease-in-out;}
		.popup-slide img.active {position: relative;opacity: 1;	z-index: 1;}
		.popup-indicator { text-align:center; margin:10px 0; }
		.popup-indicator span{ display:inline-block; width:10px; height:10px; margin:0 5px; background: rgba(0,0,0,0.3); border-radius:50%; cursor:pointer; }
		.popup-indicator span.active{ background: rgba(0,0,0,0.8); }
		#imgPopup .pop-btm { margin-top: 10px; text-align: right; margin-top: 10px; display: flex; align-items: center; gap: 10px; justify-content: flex-end; }
		#imgPopup label { line-height: 1;  font-size: 15px; }
		#imgPopup button { background:#000; color:#fff; font-size: 14px; padding: 2px 10px; }

		/* 대기열 오버레이 */
		#nfWaitOverlay { display:none; position:fixed; inset:0; background:rgba(255,255,255,0.96); z-index:10001; }
		#nfWaitOverlay .box { text-align:center; margin-top:40vh; font-family:'GmarketSans', sans-serif; }
		#nfWaitOverlay .box p { font-size:18px; color:#333; }

		/* 반응형 미디어쿼리 */
		@media all and (max-width:1300px){
			#wrap { background: url(images/intro2_bg.jpg) right center no-repeat; background-size: cover; }
			.container { padding:0 20px; width:100%; }
			.container h1 {text-align:left;}
			.container h1 img { width:650px; }
			.container li { background-size: 70px; background-position: left 20px center; height: 140px; }
			.container li a { padding-left: 110px; font-size: 24px; }
			.container li a::before { right: 10px; }
		}
		@media all and (max-width:970px){
		    .container h1 img { width: 550px; }
		    .container ul { margin-top: 60px; }
	        .container li { background-size: 50px; background-position: left 15px center; height: 120px; }
	        .container li a { padding-left: 80px; font-size: 21px; line-height: 1.1; }
	        .container li a::before { background-size: 19px;  width: 40px; height: 40px; }
		}
		@media all and (max-width:800px){
		    #wrap { background: url(images/intro2_bg02.jpg) center top no-repeat; background-size:cover; }
	        .container { padding:0 80px 100px; }
	        .container h1 { text-align: center; padding-top:100px; }
		    .container h1.mo_ver { display:block; }
		    .container h1.pc_ver { display:none; }
	        .container h1 img { width: auto; }
	        .container ul { flex-wrap: wrap; gap: 15px; margin-top:400px; }
	        .container li { flex: 1 1 100%; height:125px; background-size: 85px; background-position: left 25px center; }
	        .container li a { align-items: center; flex-flow: row; justify-content: flex-start; font-size: 24px; line-height: 1; padding-left: 135px; }
	        .container li a span { padding-left:5px; }
	        .container li a::before { right: 40px; }
			.container .bottom { height: 50px; background-size: 140px; }
		}

		@media all and (max-width:767px){
		}
		@media all and (max-width:600px){
			#wrap { background: url(images/intro2_bg02.jpg) center bottom no-repeat; }
		    .container { padding: 0 20px 100px; }
		    .container h1 { padding-top: 60px; }
	        .container h1 img { width: 350px; }
	        .container ul { margin-top: 200px; }
            .container li { height: 100px; background-size: 60px; }
            .container li a { padding-left: 100px; }
            .container li a::before { right: 20px; }
		}
		@media all and (max-width:450px){
		}
		@media all and (max-width:400px){

	        .container li a::before { right: 10px; background-size: 15px; }
		}
		@media all and (max-width:360px){
		}

<body>
	<!-- 팝업 레이어 (원본 intro.jsp 유지)
	<div id="imgPopup">
		<div class="pop-inner">
			<div class="popup-slide">
				<img src="images/intro_popup_2.png" alt="청년문화예술패스 신청 접속 장애 관련 안내 및 사과문"/>
			</div>
			<div class="popup-indicator"></div>
			<div class="pop-btm">
				<label> <input type="checkbox" id="todayClose"> 오늘 하루 보지 않기 </label>
				<button onclick="closePopup()">닫기</button>
			</div>
		</div>
	</div>-->

	<!-- 대기열 안내 오버레이 -->
	<div id="nfWaitOverlay">
		<div class="box">
			<p>대기열에 접속 중입니다.<br>잠시만 기다려 주세요...</p>
		</div>
	</div>

	<div id="wrap">
		<div class="container">
			<h1 class="pc_ver"><img src="images/intro2_logo.png" alt="청년문화예술패스"></h1>
			<h1 class="mo_ver"><img src="images/intro2_logo03.png" alt="청년문화예술패스"></h1>
			<ul>
				<li><a href="javascript:void(0);" onclick="goWithGate('segKey_2159','/kr/main.do')">대표누리집 <span>바로가기</span></a></li>
				<li><a href="javascript:void(0);" onclick="goWithGate('segKey_9681','/kr/member/join01.do?menuSn=205016')">회원가입하기</a></li>
				<li><a href="javascript:void(0);" onclick="goWithGate('segKey_1492','/kr/youthPointApply.do?menuSn=204973')">패스신청하기</a></li>
			</ul>

			<div class="bottom"><span>청년문화예술패스</span></div>
		</div>
	</div>

	<script>
	// bfcache 복원 시 대기열 오버레이 제거
	window.addEventListener('pageshow', function(e) {
		if (e.persisted) {
			document.getElementById('nfWaitOverlay').style.display = 'none';
		}
	});

	window.onload = function() {

	    if (getCookie("imgPopup") != "done") {
	        document.getElementById("imgPopup").style.display = "block";
	    }

	    const slides = document.querySelectorAll(".popup-slide img");
	    const indicatorContainer = document.querySelector(".popup-indicator");
	    let current = 0;

	    if(slides.length > 0){
	        slides[0].classList.add("active");

	        slides.forEach((slide, index)=>{
	            const dot = document.createElement("span");
	            if(index === 0) dot.classList.add("active");

	            dot.addEventListener("click", ()=>{
	                slides[current].classList.remove("active");
	                indicatorContainer.children[current].classList.remove("active");
	                current = index;
	                slides[current].classList.add("active");
	                indicatorContainer.children[current].classList.add("active");
	            });

	            indicatorContainer.appendChild(dot);
	        });

	        setInterval(()=>{
	            slides[current].classList.remove("active");
	            indicatorContainer.children[current].classList.remove("active");
	            current = (current+1) % slides.length;
	            slides[current].classList.add("active");
	            indicatorContainer.children[current].classList.add("active");
	        }, 3000);
	    }
	}

	function closePopup() {
	    if(document.getElementById("todayClose").checked){
	        setCookie("imgPopup","done",1);
	    }
	    document.getElementById("imgPopup").style.display="none";
	}

	function setCookie(name,value,days){
	    var expires = '';
	    if (days) {
	        var d = new Date();
	        d.setTime(d.getTime() + (days*24*60*60*1000));
	        expires = '; expires=' + d.toUTCString();
	    }
	    document.cookie = name + '=' + value + '; path=/' + expires;
	}
	function getCookie(name){
	    var v = document.cookie.match('(^|;) ?'+name+'=([^;]*)(;|$)');
	    return v ? v[2] : null;
	}

	/* =========================================================
	 * realEnv 대체: 운영 도메인일 때만 NetFunnel 로딩
	 * ========================================================= */
	var isRealEnv = (
		location.hostname === 'youthculturepass.or.kr' ||
		location.hostname === 'www.youthculturepass.or.kr'
	);

	if (isRealEnv) {
		var nfScript = document.createElement('script');
		nfScript.src = "https://youthculturepass.or.kr/netfunnel-statics/agents/client/javascript/netfunnel-javascript-agent.js";
		nfScript.setAttribute('data-nf-server-url', 'https://nf.youthculturepass.or.kr');
		nfScript.setAttribute('data-nf-setting-url', 'https://nf.youthculturepass.or.kr/assets/nf-setting/1/nf-setting.json');
		nfScript.setAttribute('data-nf-vwr-page-url', 'https://youthculturepass.or.kr/netfunnel-statics/assets/vwr-page/1/index.html');
		nfScript.setAttribute('data-nf-retry-count', '1');
		nfScript.setAttribute('data-nf-network-timeout', '1000');
		nfScript.setAttribute('data-nf-print-log', 'false');
		nfScript.setAttribute('data-nf-use-credential', 'false');
		nfScript.setAttribute('data-nf-error-bypass', 'false');
		document.head.appendChild(nfScript);

		var eumScript = document.createElement('script');
		eumScript.src = "https://youthculturepass.or.kr/netfunnel-statics/agents/eum/browser/eum-browser.js";
		eumScript.defer = true;
		eumScript.onload = function () {
			try {
				window.STC_EUM.initialize({
					serverURL: "https://nf.youthculturepass.or.kr/eum_data",
					settingURL: "https://nf.youthculturepass.or.kr/assets/nf-setting/1/nf-setting.json",
					clientId: "1",
					trackResource: true,
					printLog: false
				});
			} catch (e) {}
		};
		document.head.appendChild(eumScript);
	}

	/* =========================================================
	 * 버튼 클릭 → 세그먼트별 대기열 판정 → 통과 시 이동
	 * - 대기열 미통과 시: NetFunnel 에이전트가 자체 대기실(vwr-page)을 띄우고
	 *   내부적으로 재시도하다가 통과하면 콜백을 실행함 (별도 새로고침/백오프 불필요)
	 * ========================================================= */
	function goWithGate(segmentKey, targetUrl) {

		if (!isRealEnv || typeof nfStart !== 'function') {
			// 개발/로컬: 넷퍼넬 없이 바로 이동 (쿠키는 동일하게 세팅해 Apache 테스트 가능)
			setCookie('nf_pass', '1', 30/1440); // 30분
			window.location.href = targetUrl;
			return;
		}

		document.getElementById('nfWaitOverlay').style.display = 'block';

		try {
			nfStart({ projectKey: 'service_1', segmentKey: segmentKey }, function (res) {
				if (res && (res.statusCode === 200 || res.statusCode === 300)) {
					setCookie('nf_pass', '1', 30/1440); // 30분 유효
					window.location.href = targetUrl;
				} else {
					document.getElementById('nfWaitOverlay').style.display = 'none';
					alert('대기열 처리 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.');
				}
			});
		} catch (e) {
			document.getElementById('nfWaitOverlay').style.display = 'none';
			alert('대기열 모듈 호출 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.');
		}
	}
	</script>
</body>
