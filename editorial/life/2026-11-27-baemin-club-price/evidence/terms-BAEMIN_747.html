<p>회사가 제공하는 서비스의 구성은 아래와 같습니다.</p><figure class="table"><table><thead><tr><th><span style="color:hsl(0,0%,0%);"><strong>서비스 구분</strong></span></th><th><span style="color:hsl(0,0%,0%);"><strong>서비스 내용</strong></span></th></tr></thead><tbody><tr><td>기본 서비스</td><td>배달의민족 회원가입 시 이용할 수 있는 기본적인 서비스 (배달/포장, B마트, 배민스토어, 전국특가, 선물하기)</td></tr><tr><td>추가 서비스</td><td>배달의민족 회원가입 후 추가 가입이 필요한 서비스 (배민페이)</td></tr></tbody></table></figure><p>회사가 제공하는 서비스는 배달의민족 회원 계정을 기반으로 제공되며, 서비스 구분에 따라 별도의 가입 및 추가 동의가 필요한 형태로 제공될 수 있습니다.</p><p>개인정보 처리정지 또는 탈퇴를 요청하는 경우, 기본 서비스는 계정 단위로 적용될 수 있으며, 추가 서비스의 경우 해당 서비스에 한하여 탈퇴 및 동의 철회가 가능합니다.</p><p>개인정보 처리정지 및 탈퇴 절차에 관한 자세한 사항은 개인정보처리방침 제7조 「이용자 및 법정대리인의 권리와 그 행사방법」을 참고하시기 바랍니다.</p>
