<html lang="ko">
<!-- s : Modal 사진 규격 팝업 script -->
<head>
    <script type="text/javascript">
        $(document).ready(function() {
            var modalPopupDiv = document.getElementById("modalPopupDiv");
            //닫기버튼
            document.addEventListener('keydown',function(e){
                if(e.keyCode == 13 && modalPopupDiv.style.display != "none") {
                      fnPopupClose();
                }
            });
        });

        //닫기
        function fnPopupClose(){
            var focusId = 'commonPhotoRuleBtn';
            setTimeout(function() { $("#"+focusId).focus();}, 50);
            $("#modalPopupDiv").modal("hide");
        }
    </script>
</head>
<!-- e : Modal 사진 규격 팝업 script -->

<!-- s : Modal 사진 규격 -->
<body>
       <div class="modal-body">
           <h6 style="padding-top:30px;">허용되는 사진 규격</h6>
           <div style="max-height: calc(100vh - 200px); overflow-x:hidden; overflow-y:auto; padding-right: 1rem;" tabindex="0">
	           <p style="color: #555555;">운전면허증 선명도 향상을 위해 운전면허증 제작용 사진의 표준 규격을 마련하였습니다.
	              <br>아래 표준규격 및 예시사진을 참고, 표준규격에 맞는 사진을 제출하시기 바랍니다.</p>
	           <div class="page-btn-wrap left gap-t1 gap-b2">
	               <button type="button" class="btn sm tertiary" title="새창으로 열림" onclick="window.open('https://www.passport.go.kr/home/kor/contents.do?menuPos=32')" style="outline-offset:7px;"><span>외교부 여권사진 규정 보기<i class="ico-link"></i></span></button>
	           </div>
	           <img src="/resources/img/photo_yes2024.png" alt="표준 사진:3.5cm X 4.5cm 탈모, 상반신, 흰색 배경, 6개월 이내 촬영한 컬러 사진(사진인화용지에 인화된 사진만 허용), 복사 또는 포토샵 등으로 수정하지 않은 사진, 얼굴 방향은 정면을 응시하고 기울어지지 않은 사진, 색안경 착용 등 눈을 가리지 않은 사진.
	           얼굴비율 · 사진 품질:머리 길이가 정수리(머리 최상부)부터 턱까지 3.2~3.6cm 사이인 사진, 화상자료 입력용도로 적합한 사진
	           배경 · 조명:배경은 균일하고 잉크 자국이 없는 흰색, 테두리가 없어야 합니다., 부적절한 조명을 사용하여 원래 피부색과 다르면 안됩니다.
	           장신구 · 보정:악세서리 착용으로 인한 과도한 얼굴가림이 없어야합니다., 인위적으로 합성된 사진 불가
	           얼굴 방향 · 표정:정면구도,정면 응시, 무왜곡, 표정은 무펴정을 유지해야 하며 치아가 보이면 안됩니다.
	           온라인 신청시:파일 크기 500KB 이하의 JPG파일, 가로 413 픽셀(pixel), 세로 531 픽셀 권장, *가로 395~431, 세로 507~550 필셀 이내만 업로드 가능, 300dpi 해상도 권장
	           *제출사진이 사진규격에 부합하지 않는 경우 면허증 발급이 지연 및 반려될 수 있습니다."/>
           </div>
       </div>
       <div class="modal-footer">
           <button type="button" class="btn md" title="닫기" onclick="javascript:fnPopupClose();" style="outline-offset:7px;">닫기</button>
       </div>
       <button type="button" class="modal-btn-close" title="닫기" onclick="javascript:fnPopupClose();">닫기</button>
</body>
<!-- e : Modal 사진 규격 -->
</html>
