<p>기본값은 강남구에서 장롱 1쪽, 2인용 침대, 3인용 소파, 냉장고를 한 번에 내놓는 경우다. 장롱 10,000원 + 침대 15,000원 + 소파 7,000원으로 32,000원이고, 냉장고는 무상방문수거로 돌리면 0원이다. 체크를 풀면 조례 금액 8,000원이 더해져 40,000원이 된다.</p>
<h2 id="compare">지역별 수수료 비교표</h2>
<p>계산기와 같은 데이터를 다섯 품목만 추려 한 표로 놓았다. '무상·면제'는 그 구 별표에 냉장고·세탁기가 무상 또는 면제로 적힌 경우이고, '규격 다름'은 인원 수가 아니라 너비로 매기는 경우다.</p>
