function isMobile(){
	return navigator.userAgent.match(/(ip(hone|od|ad)|android|BlackBerry|IEMobile|Opera Mini|windows(phone|ce)|blackberry|s(ymbian|eries60|amsung)|nokia|fennec|htc[\-_]|m(idp|obile)|up\.browser|[1-4][0-9]{2}x[1-4][0-9]{2})/i);
}
 
function isMobilePlatform(){
	var filter = "win16|win32|win64|mac";
	if(navigator.platform){
		if(filter.indexOf(navigator.platform.toLowerCase())<0){
			return true;
		}else{
			return false;
		}
	}else{
		return false;
	}
}
