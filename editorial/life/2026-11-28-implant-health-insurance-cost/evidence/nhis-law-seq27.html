$(document).ready(function(){
	//아이프레임 높이를 딱 맞춰서 지정해줌.
	var wHeight = $(window).height();
	//좌측 트리메뉴 높이 조절

		wHeight = 790;
	}
	//$("#law-list dl dd iframe").height(wHeight-41);    
	//우측 컨텐츠 높이 조절
	$(".law-con-view iframe").height(wHeight-156);
});

	var wHeight = $(window).height();
	if(wHeight < 790) {
		wHeight = 790;
	}
	//좌측 트리메뉴 높이 조절

});

function thisChangeHistory(seq){
	var hseq = $("#histroySeq").val();
	if(hseq != 0){
		saveFocus();
		location.href = "/lm/lmxsrv/law/lawFullView.do?SEQ="+seq+"&SEQ_HISTORY="+hseq;
	}
}

var fontPt = 100;
function thisFontPt(num){
	fontPt = fontPt + num;
	$("#fontPt").text(fontPt);
}

function oneviewList() {
	if ($("#oneViewLayer").css("display") == "none"){
		$("#oneViewLayer").css("display","block");
		$("#lawFullContent").contents().find("a.oneview").removeClass("overview");
	} else {
		$("#oneViewLayer").css("display","none");
	}
}

function oneviewScroll(key) {
	if ($("#oneViewLayer").css("display") == "none"){
		$("#oneViewLayer").css("display","block");
	} else {
		$("#oneViewLayer").css("display","none");
		$("#lawFullContent").contents().find("a.oneview").addClass("overview");
	}
	const $container = $("#lawFullContent").contents();
	const $target = $container.find('#' + key);
	if($target.length === 0 ) return;
	
	
	$container.find("html, body").animate({
		scrollTop: $target.offset().top
	}, 400);

}
