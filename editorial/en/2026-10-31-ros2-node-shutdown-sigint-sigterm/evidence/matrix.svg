<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" font-family="Helvetica,Arial,sans-serif"><rect width="1500" height="600" fill="#fff"/>
<text x="30" y="50" font-size="30" font-weight="700" fill="#1d2420">What a ROS 2 Python node sees on shutdown, by distro</text>
<text x="30" y="86" font-size="19" fill="#5d6a62">Official Docker images, 2026-10-27. Whenever the node got as far as spinning, its finally block still ran.</text>
<text x="597" y="124" font-size="21" font-weight="700" text-anchor="middle" fill="#1d2420">Humble (rclpy 3.3.22)</text>
<text x="947" y="124" font-size="21" font-weight="700" text-anchor="middle" fill="#1d2420">Jazzy (7.1.12)</text>
<text x="1297" y="124" font-size="21" font-weight="700" text-anchor="middle" fill="#1d2420">Lyrical (10.0.11)</text>
<text x="30" y="185" font-size="20" fill="#1d2420">Ctrl+C (SIGINT) during spin</text>
<rect x="430" y="148" width="334" height="64" rx="6" fill="#1f7a3f"/>
<text x="597" y="187" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">KeyboardInterrupt</text>
<rect x="780" y="148" width="334" height="64" rx="6" fill="#1f7a3f"/>
<text x="947" y="187" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">KeyboardInterrupt</text>
<rect x="1130" y="148" width="334" height="64" rx="6" fill="#1f7a3f"/>
<text x="1297" y="187" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">KeyboardInterrupt</text>
<text x="30" y="265" font-size="20" fill="#1d2420">kill (SIGTERM) during spin</text>
<rect x="430" y="228" width="334" height="64" rx="6" fill="#1f7a3f"/>
<text x="597" y="267" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">ExternalShutdownException</text>
<rect x="780" y="228" width="334" height="64" rx="6" fill="#1f7a3f"/>
<text x="947" y="267" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">ExternalShutdownException</text>
<rect x="1130" y="228" width="334" height="64" rx="6" fill="#b42318"/>
<text x="1297" y="267" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">RCLError, exit 1 (10/10)</text>
<text x="30" y="345" font-size="20" fill="#1d2420">rclpy.shutdown() after Ctrl+C</text>
<rect x="430" y="308" width="334" height="64" rx="6" fill="#9a6a00"/>
<text x="597" y="347" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">RCLError: already called</text>
<rect x="780" y="308" width="334" height="64" rx="6" fill="#9a6a00"/>
<text x="947" y="347" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">RCLError: already called</text>
<rect x="1130" y="308" width="334" height="64" rx="6" fill="#1f7a3f"/>
<text x="1297" y="347" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">ok</text>
<text x="30" y="425" font-size="20" fill="#1d2420">rclpy.try_shutdown() after Ctrl+C</text>
<rect x="430" y="388" width="334" height="64" rx="6" fill="#1f7a3f"/>
<text x="597" y="427" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">ok</text>
<rect x="780" y="388" width="334" height="64" rx="6" fill="#1f7a3f"/>
<text x="947" y="427" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">ok</text>
<rect x="1130" y="388" width="334" height="64" rx="6" fill="#1f7a3f"/>
<text x="1297" y="427" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">ok</text>
<text x="30" y="505" font-size="20" fill="#1d2420">with rclpy.init():</text>
<rect x="430" y="468" width="334" height="64" rx="6" fill="#b42318"/>
<text x="597" y="507" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">AttributeError</text>
<rect x="780" y="468" width="334" height="64" rx="6" fill="#b42318"/>
<text x="947" y="507" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">TypeError</text>
<rect x="1130" y="468" width="334" height="64" rx="6" fill="#1f7a3f"/>
<text x="1297" y="507" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">works</text>
<text x="30" y="580" font-size="17" fill="#5d6a62">huntlab.app</text></svg>