# Deployed above "# BEGIN WordPress" in /var/www/html/.htaccess (2026-10-09). Backup: .htaccess.bak-20261009
# Synced from server 2026-11-04 (include-only PHP 11/02, root wp-config-sample/wp-settings 11/03, mu-plugins + Options -Indexes 11/04). Backup: /var/backups/htaccess.bak-20261104
# BEGIN HuntLab scanner block
# Probes for secrets/config files (spoofed AI user agents included) get 403 before PHP runs.
<IfModule mod_rewrite.c>
RewriteEngine On
# Foreign domains (api.cokoedu.com, besira.net, raw IP) pointed here served full duplicate copies with their own canonical, 2026-10-27.
RewriteCond %{HTTP_HOST} !^(huntlab\.app|127\.0\.0\.1|localhost)(:[0-9]+)?$ [NC]
RewriteRule ^ https://huntlab.app%{REQUEST_URI} [R=301,L]
RewriteRule (^|/)\.(?!well-known/) - [F,L]
RewriteRule (^|/)(terraform\.tfstate|terraform\.tfvars|serviceAccountKey\.json|service_account\.json|key\.json|token\.json|firebase-adminsdk[^/]*\.json|application\.properties|secrets\.yml|swagger\.json|graphql)$ - [F,L]
# Include-only PHP (WordPress Hardening doc): scanners ran ~700 req/h of these into PHP 500s, 19,928 of 20,408 5xx since 2026-07; MaxRequestWorkers hit 2026-11-01. Added 2026-11-02.
RewriteRule ^wp-admin/includes/ - [F,L]
RewriteCond %{REQUEST_URI} !^/wp-includes/js/tinymce/wp-tinymce\.php$
RewriteRule ^wp-includes/.+\.php$ - [F,L]
RewriteRule ^wp-includes/theme-compat/ - [F,L]
RewriteRule ^(wp-config-sample|wp-settings)\.php$ - [F,L]
# mu-plugins are include-only; the open directory listing let a scanner call all 16 files into 500s, 2026-11-03.
RewriteRule ^wp-content/mu-plugins/.+\.php$ - [F,L]
# Referral bot traffic (speedexplore.com, TikTok in-app burst 2026-10-22) kept off ad pages: AdSense invalid traffic risk.
RewriteCond %{HTTP_REFERER} speedexplore\.com [NC]
RewriteRule ^ - [F,L]
</IfModule>
# END HuntLab scanner block
# Directory listing was on (apache2.conf <Directory /var/www/html> Options Indexes): uploads and mu-plugins were browsable. WordPress Hardening doc, 2026-11-04.
Options -Indexes
